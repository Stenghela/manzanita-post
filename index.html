<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manzanita Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e7d8ae;
    --paper-deep: #dcc98c;
    --paper-line: #cdb87e;
    --grey: #302d27;
    --ink: #2a1d12;
    --ink-soft: #6b5738;
    --ink-red: #8a2f22;
    --gold: #8a6a2c;
    --rule: rgba(42,29,18,.28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #36291a; --paper-deep: #2b2013; --paper-line: #493a24; --grey: #403d37;
      --ink: #ecdfc4; --ink-soft: #b9a374; --ink-red: #dd8a72; --gold: #d6b364;
      --rule: rgba(236,223,196,.22);
    }
  }
  :root[data-theme="dark"]{
    --paper: #36291a; --paper-deep: #2b2013; --paper-line: #493a24; --grey: #403d37;
    --ink: #ecdfc4; --ink-soft: #b9a374; --ink-red: #dd8a72; --gold: #d6b364;
    --rule: rgba(236,223,196,.22);
  }
  *,*::before,*::after{ box-sizing: inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }

  body{
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse 520px 320px at 6% -4%, rgba(0,0,0,.06), transparent 60%),
      radial-gradient(ellipse 420px 320px at 98% 104%, rgba(0,0,0,.06), transparent 60%);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 20px 14px 120px;
  }

  .header{ max-width: 1240px; margin: 0 auto 16px; border-bottom: 3px double var(--rule); padding-bottom: 12px; }
  .header h1{ font-family: 'Rye','Impact',serif; font-size: 28px; letter-spacing: 1px; margin: 0; color: var(--ink); font-weight: normal; }

  .layout{ max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: start; }

  .categories-grid{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; align-items: start; }
  .cell-caccia{ grid-row: 1; grid-column: 1; }
  .cell-pesca{ grid-row: 1; grid-column: 2; }
  .cell-attrezzi{ grid-row: 2; grid-column: 1; }
  .cell-canne{ grid-row: 2; grid-column: 2; }
  .cell-esche-caccia{ grid-row: 3; grid-column: 1; }
  .cell-esche-pesca{ grid-row: 3; grid-column: 2; }
  .cell-esche-trappole-caccia{ grid-row: 4; grid-column: 1; }
  .cell-esche-trappole-pesca{ grid-row: 4; grid-column: 2; }
  .cell-trappole{ grid-row: 5; grid-column: 1 / -1; }
  .cell-vendite{ grid-row: 6; grid-column: 1 / -1; }
  .cell-regole{ grid-row: 7; grid-column: 1 / -1; }

  .category{ background: var(--paper-deep); border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); border-radius: 0; overflow: hidden; }
  .category-head{ display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; user-select: none; }
  .category-head .arrow{ margin-left: auto; color: var(--gold); font-size: 11px; transition: transform .2s ease; }
  .category.collapsed .arrow{ transform: rotate(-90deg); }
  .category-body{ overflow: hidden; }
  .category.collapsed .category-body{ display: none; }
  .category-head .icon{ font-size: 15px; }
  .category-head h2{ font-family: Georgia, 'Times New Roman', serif; font-variant: small-caps; font-size: 15px; font-weight: normal; letter-spacing: .4px; margin: 0; color: var(--ink); }
  .neg-label{ text-decoration: underline; text-decoration-color: var(--ink-red); color: var(--ink-red); font-size: 10px; letter-spacing: 0; }

  .rows{ padding: 2px 0; }
  .row{ display: grid; grid-template-columns: minmax(0,1fr) 60px 108px 76px; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px dashed var(--rule); }
  .row:last-child{ border-bottom: none; }
  .item-name{ font-size: 12px; }
  .row:hover{ background: rgba(0,0,0,.035); }
  .item-price{ font-size: 10.5px; color: var(--ink-soft); text-align: right; }

  .qty-cubes{ display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }
  .qty-cube{ width: 30px; height: 26px; background: transparent; border: 1px solid var(--ink-soft); border-radius: 4px; color: var(--ink); font-family: 'Courier New', monospace; font-size: 12px; text-align: center; padding: 2px; }
  .qty-cube:focus{ outline: none; border-color: var(--ink-red); }
  .qty-cube::-webkit-outer-spin-button, .qty-cube::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
  .cube-btn{ width: 22px; height: 22px; line-height: 19px; padding: 0; border: 1px dashed var(--ink-soft); border-radius: 4px; background: transparent; color: var(--gold); font-family: Georgia, serif; font-size: 14px; text-align: center; cursor: pointer; }
  .cube-btn:hover{ background: rgba(0,0,0,.06); }
  .cube-btn.remove{ color: var(--ink-red); border-color: var(--ink-red); }

  .row-total{ font-family: 'Courier New', monospace; text-align: right; font-size: 12px; color: var(--gold); min-width: 60px; }

  .category-subtotal{ display: flex; justify-content: flex-end; gap: 8px; padding: 6px 12px; background: rgba(0,0,0,.045); font-size: 11px; color: var(--ink-soft); border-top: 1px solid var(--rule); }

  .category.positive{ border-top-color: var(--gold); }
  .category.negative{ border-top-color: var(--ink-red); }
  .category.regole{ border-top: 3px double var(--ink-red); }
  .rules-list{ margin: 0; padding: 8px 14px 6px 34px; font-size: 13px; line-height: 1.5; }
  .rules-list li{ padding: 4px 0; }
  .rules-list .pena{ color: var(--ink-red); font-weight: bold; }
  .rules-note{ margin: 0; padding: 8px 14px 12px; font-size: 12.5px; font-style: italic; color: var(--ink-soft); border-top: 1px dashed var(--rule); }

  .summary-panel{ background: var(--paper-deep); border-top: 3px double var(--gold); border-bottom: 1px solid var(--rule); padding: 12px; position: sticky; top: 14px; max-height: calc(100vh - 160px); overflow-y: auto; }
  .summary-title{ font-family: Georgia, 'Times New Roman', serif; font-variant: small-caps; font-size: 16px; margin: 0 0 8px; color: var(--ink); font-weight: normal; border-bottom: 1px dashed var(--rule); padding-bottom: 6px; }
  .summary-empty{ font-size: 12px; color: var(--ink-soft); margin: 0; }
  .summary-row{ display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--rule); }
  .summary-row:last-child{ border-bottom: none; }
  .summary-row-main{ display: flex; flex-direction: column; min-width: 0; }
  .summary-name{ font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .summary-cat{ font-size: 9.5px; color: var(--ink-soft); }
  .summary-row-nums{ display: flex; align-items: baseline; gap: 6px; flex-shrink: 0; }
  .summary-qty{ font-size: 11px; color: var(--ink-soft); }
  .summary-val{ font-size: 12px; font-family: 'Courier New', monospace; }
  .summary-val.pos{ color: var(--gold); }
  .summary-val.neg{ color: var(--ink-red); }
  .summary-total{ display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 3px double var(--rule); font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; color: var(--ink); }

  .footer-bar{ position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 3px double var(--rule); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
  .footer-inner{ max-width: 1240px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .grand-total{ display: flex; align-items: baseline; gap: 10px; }
  .grand-total .label{ font-size: 13px; color: var(--ink-soft); }
  .grand-total .amount{ font-family: 'Courier New', monospace; font-weight: bold; font-size: 28px; color: var(--ink); }

  .reset-btn{ background: transparent; border: 1px solid var(--ink-red); color: var(--ink-red); padding: 9px 16px; font-family: Georgia, serif; font-variant: small-caps; font-size: 13.5px; letter-spacing: .5px; border-radius: 0; cursor: pointer; transition: background .15s, color .15s; }
  .reset-btn:hover{ background: var(--ink-red); color: var(--paper); }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .summary-panel{ position: static; max-height: none; }
  }
  @media (max-width: 640px){
    .categories-grid{ grid-template-columns: 1fr; }
    .categories-grid > .category{ grid-column: 1; grid-row: auto; }
    .row{ grid-template-columns: 1fr 52px 92px 68px; gap: 6px; padding: 6px 10px; }
    .item-name{ font-size: 12px; }
    .header h1{ font-size: 23px; }
    .grand-total .amount{ font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Manzanita Post</h1>
</div>

<div class="layout">
  <div class="categories-grid" id="categories"></div>
  <aside class="summary-panel">
    <h2 class="summary-title">Listino</h2>
    <div class="summary-list" id="summaryList"><p class="summary-empty">Nessun articolo inserito.</p></div>
    <div class="summary-total"><span>Totale</span><span id="summaryTotal">$0.00</span></div>
  </aside>
</div>

<div class="footer-bar">
  <div class="footer-inner">
    <button class="reset-btn" onclick="resetAll()">Svuota registro</button>
    <div class="grand-total">
      <span class="label">Totale dovuto</span>
      <span class="amount" id="grandTotal">$0.00</span>
    </div>
  </div>
</div>

<script>
const data = [
  { name: "Pesca", icon: "🐟", items: [
    { n: "Granchio", p: 0.10 },
    { n: "Ostrica", p: 0.10 },
    { n: "Perca Gialla Piccolo", p: 0.60 },
    { n: "Perca di Scoglio Piccolo", p: 0.60 },
    { n: "Pickerel Piccolo", p: 0.70 },
    { n: "Pickerel Rosso Piccolo", p: 0.70 },
    { n: "Pesce Gatto Nebuloso Piccolo", p: 0.70 },
    { n: "Persico Dalle Branchie Blue", p: 0.80 },
    { n: "Salmone Rosso Piccolo", p: 1.00 },
    { n: "Pesci Medi", p: 1.00 },
    { n: "Pesci Grandi", p: 1.50 },
    { n: "Boccalone Grande", p: 20.00 },
    { n: "Salmone Rosso Grande", p: 17.50 },
    { n: "Trota Iridea Grande", p: 28.00 },
    { n: "Persico Trota Dolomeu Grande", p: 41.00 },
    { n: "Pesce Gatto Gigante", p: 0.00 },
  ]},

  { name: "Caccia", icon: "🏹", items: [
    { n: "Piume Di Uccello", p: 0.50 },
    { n: "Carne Bianca", p: 0.40 },
    { n: "Carne Rossa", p: 0.50 },
    { n: "Fegato Di Uccello", p: 0.60 },
    { n: "Pelle", p: 0.60 },
    { n: "Carne Di Cervo", p: 0.60 },
    { n: "Bistecca", p: 0.80 },
    { n: "Veleno", p: 0.70 },
    { n: "Corna", p: 0.75 },
    { n: "Pelle Di Rettile", p: 0.85 },
    { n: "Pelliccia", p: 0.85 },
    { n: "Artiglio", p: 0.90 },
    { n: "Pezzi Leggendari", p: 4.00, tierQty: 50, tierPrice: 4.50 },
  ]},
  { name: "Canne", icon: "🎣", negative: true, items: [
    { n: "Canna Da Pesca", p: 11.00 },
    { n: "Canna Migliorata (full kit)", p: 20.00 },
    { n: "Impugnatura", p: 3.00 },
    { n: "Fusto", p: 3.00 },
    { n: "Mulinello", p: 5.00 },
    { n: "Lenza", p: 3.00 },
    { n: "Mulinello In Metallo", p: 10.00 },
  ]},

  { name: "Attrezzi", icon: "🛠️", negative: true, items: [
    { n: "Fuoco da campo", p: 2.00 },
    { n: "Lazo", p: 12.00 },
    { n: "Coltello", p: 14.00 },
    { n: "Arco", p: 18.00 },
    { n: "Frecce", p: 0.08 },
  ]},

  { name: "Esche Pesca", icon: "🪱", negative: true, items: [
    { n: "Grilli", p: 0.15 },
    { n: "Esca di Libellula", p: 0.15 },
    { n: "Esca Di Pesce", p: 12.00 },
    { n: "Esca Di Pesce Leggendaria", p: 3.00 },
    { n: "Esca di Libellula Leggendaria", p: 5.00 },
    { n: "Esca Di Aragosta Leggendaria", p: 5.00 },
    { n: "Esca Spinner V4 Leggendaria", p: 10.00 },
    { n: "Esca Spinner V6 Leggendaria", p: 12.00 },
  ]},

  { name: "Esche Trappole Pesca", icon: "🪤", negative: true, items: [
    { n: "Esca Per Pesci Piccoli", p: 0.30 },
    { n: "Esca Per Pesci Medi", p: 0.40 },
    { n: "Esca Per Pesci Grandi", p: 0.60 },
    { n: "Esca Granchio", p: 0.30 },
  ]},

  { name: "Esche Caccia", icon: "🏹", negative: true, items: [
    { n: "Esca Per Cervi", p: 0.50 },
    { n: "Esca Per Arieti", p: 1.00 },
    { n: "Esca Per Serpenti", p: 0.50 },
    { n: "Esca Per Puma", p: 5.00 },
    { n: "Esche orso", p: 5.00 },
    { n: "Esche Grizzly", p: 3.00 },
  ]},

  { name: "Esche Trappole Caccia", icon: "🪤", negative: true, items: [
    { n: "Esche Scoiattolo, Topo e Corvo", p: 0.40 },
    { n: "Esche Puzzola e Opossum", p: 0.50 },
  ]},

  { name: "Trappole", icon: "🪤", negative: true, items: [
    { n: "Trappola per Animali Piccoli", p: 4.50 },
    { n: "Trappola per Pesci", p: 4.50 },
  ]},
  { name: "Vendite calmierate - Saloons", icon: "🥩", negative: true, items: [
    { n: "Carne Bianca", p: 0.50 },
    { n: "Carne Rossa", p: 0.60 },
    { n: "Carne Di Cervo", p: 0.70 },
  ]},
];

const cellClass = {
  "Caccia": "cell-caccia",
  "Pesca": "cell-pesca",
  "Attrezzi": "cell-attrezzi",
  "Canne": "cell-canne",
  "Esche Caccia": "cell-esche-caccia",
  "Esche Pesca": "cell-esche-pesca",
  "Esche Trappole Caccia": "cell-esche-trappole-caccia",
  "Esche Trappole Pesca": "cell-esche-trappole-pesca",
  "Trappole": "cell-trappole",
  "Vendite calmierate - Saloons": "cell-vendite",
};

const container = document.getElementById("categories");

data.forEach((cat, ci) => {
  const catDiv = document.createElement("div");
  catDiv.className = `category collapsed ${cat.negative ? "negative" : "positive"}`;
  if (cellClass[cat.name]) catDiv.classList.add(cellClass[cat.name]);

  if (["Pesca", "Caccia"].includes(cat.name)) catDiv.classList.remove("collapsed");

  const head = document.createElement("div");
  head.className = "category-head";
  const negLabel = cat.negative ? ` <span class="neg-label">— vendita, importo negativo</span>` : "";
  head.innerHTML = `<span class="icon">${cat.icon}</span><h2>${cat.name}${negLabel}</h2><span class="arrow">▼</span>`;
  head.onclick = () => catDiv.classList.toggle("collapsed");
  catDiv.appendChild(head);

  const body = document.createElement("div");
  body.className = "category-body";

  const rows = document.createElement("div");
  rows.className = "rows";

  cat.items.forEach((item, ii) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span class="item-name">${item.n}</span>
      <span class="item-price">${item.tierQty ? `$${item.p.toFixed(2)}/$${item.tierPrice.toFixed(2)}<br>-${item.tierQty}+` : `$${item.p.toFixed(2)}`}</span>
      <span class="qty-cubes" id="cubes-${ci}-${ii}">
        <input type="number" min="0" step="1" value="" placeholder="0" class="qty-cube" data-ci="${ci}" data-ii="${ii}" oninput="calculate()">
        <button type="button" class="cube-btn add" onclick="addCube(${ci},${ii})" title="Aggiungi un altro numero">+</button>
        <button type="button" class="cube-btn remove" onclick="removeCube(${ci},${ii})" title="Rimuovi ultimo numero">−</button>
      </span>
      <span class="row-total" id="total-${ci}-${ii}">$0.00</span>
    `;
    rows.appendChild(row);
  });

  body.appendChild(rows);

  const subtotal = document.createElement("div");
  subtotal.className = "category-subtotal";
  subtotal.innerHTML = `Subtotale: <span id="subtotal-${ci}">$0.00</span>`;
  body.appendChild(subtotal);

  catDiv.appendChild(body);

  container.appendChild(catDiv);
});

// Sezione Regole Manzanita
(function(){
  const div = document.createElement("div");
  div.className = "category positive cell-regole regole";
  div.innerHTML = `
    <div class="category-head"><span class="icon">📜</span><h2>Regole Manzanita</h2><span class="arrow">▼</span></div>
    <div class="category-body">
      <ol class="rules-list">
        <li>Chiunque si lamenta dei prezzi è bandito per <span class="pena">3 giorni</span>.</li>
        <li>Chiunque raggira o tratta male i dipendenti è bandito <span class="pena">a vita</span>.</li>
        <li>Chiunque lascia incustoditi i cavalli all'interno del recinto è bandito per <span class="pena">3 giorni</span>.</li>
        <li>Chiunque salta la fila, o tenta di farlo, è bandito per <span class="pena">1 giorno</span>.</li>
      </ol>
      <p class="rules-note">Ricordiamo inoltre che non siamo tenuti a comprare né a servire nessuno. Tutto ciò che serve si può comprare e vendere all'Emporio e dal Macellaio.</p>
    </div>`;
  div.querySelector(".category-head").onclick = () => div.classList.toggle("collapsed");
  container.appendChild(div);
})();

function addCube(ci, ii){
  const container = document.getElementById(`cubes-${ci}-${ii}`);
  const input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.step = "1";
  input.placeholder = "0";
  input.className = "qty-cube";
  input.dataset.ci = ci;
  input.dataset.ii = ii;
  input.oninput = calculate;
  const addBtn = container.querySelector(".cube-btn.add");
  container.insertBefore(input, addBtn);
}

function removeCube(ci, ii){
  const container = document.getElementById(`cubes-${ci}-${ii}`);
  const cubes = container.querySelectorAll(".qty-cube");
  if (cubes.length > 1){
    container.removeChild(cubes[cubes.length - 1]);
    calculate();
  }
}

function calculate(){
  let grand = 0;
  const active = [];
  data.forEach((cat, ci) => {
    let subtotal = 0;
    const sign = cat.negative ? -1 : 1;
    cat.items.forEach((item, ii) => {
      const cubes = document.querySelectorAll(`.qty-cube[data-ci="${ci}"][data-ii="${ii}"]`);
      let qty = 0;
      cubes.forEach(c => { qty += parseFloat(c.value) || 0; });
      let rowValue;
      if (item.tierQty && qty >= item.tierQty){
        rowValue = qty * item.tierPrice;
      } else {
        rowValue = qty * item.p;
      }
      const rowTotal = sign * rowValue;
      document.getElementById(`total-${ci}-${ii}`).textContent = `${rowTotal < 0 ? "-" : ""}$${Math.abs(rowTotal).toFixed(2)}`;
      subtotal += rowTotal;
      if (qty > 0){
        active.push({ name: item.n, cat: cat.name, qty, value: rowTotal });
      }
    });
    document.getElementById(`subtotal-${ci}`).textContent = `${subtotal < 0 ? "-" : ""}$${Math.abs(subtotal).toFixed(2)}`;
    grand += subtotal;
  });
  document.getElementById("grandTotal").textContent = `${grand < 0 ? "-" : ""}$${Math.abs(grand).toFixed(2)}`;
  renderSummary(active, grand);
}

function renderSummary(active, grand){
  const list = document.getElementById("summaryList");
  if (active.length === 0){
    list.innerHTML = `<p class="summary-empty">Nessun articolo inserito.</p>`;
  } else {
    list.innerHTML = active.map(a => `
      <div class="summary-row">
        <div class="summary-row-main">
          <span class="summary-name">${a.name}</span>
          <span class="summary-cat">${a.cat}</span>
        </div>
        <div class="summary-row-nums">
          <span class="summary-qty">×${a.qty}</span>
          <span class="summary-val ${a.value < 0 ? "neg" : "pos"}">${a.value < 0 ? "-" : ""}$${Math.abs(a.value).toFixed(2)}</span>
        </div>
      </div>
    `).join("");
  }
  document.getElementById("summaryTotal").textContent = `${grand < 0 ? "-" : ""}$${Math.abs(grand).toFixed(2)}`;
}

function resetAll(){
  document.querySelectorAll(".qty-cubes").forEach(container => {
    const cubes = container.querySelectorAll(".qty-cube");
    cubes.forEach((c, idx) => {
      if (idx < 1){ c.value = ""; } else { container.removeChild(c); }
    });
  });
  calculate();
}

calculate();
</script>

</body>
</html>

<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Merriweather:wght@400;700&family=Rye&display=swap" rel="stylesheet"><link rel="stylesheet" href="stile.css"><title>Manzanita Post · Eventi gara</title></head><body>
<header><h1>Manzanita Post</h1><div id="nav"></div></header>
<main><p id="err"></p>
<div class="box"><h2>Evento</h2><div class="f"><label>Nome evento<input id="evento" list="evs" placeholder="Es. Gara di pesca" autocomplete="off"></label><label>Data<input id="data" type="date"></label></div><datalist id="evs"></datalist></div>
<form class="box" id="form"><h2>Consegna di un partecipante</h2><div class="f">
<label>Persona<input id="persona" required></label><label>Oggetto<input id="oggetto" required></label>
<label>Quantità<input id="qty" type="number" min="1" value="1" required></label></div><p><button>Registra consegna</button></p></form>
<div class="box"><h2>Totali per oggetto</h2><div class="tot" id="tot"></div></div>
<div class="box"><h2>Consegne registrate</h2><div id="lista"></div></div></main>
<script src="app.js"></script><script>
$('#nav').innerHTML=nav('e');let rows=[];
let busy=0;try{rows=JSON.parse(localStorage.getItem('mp_eventi')||'[]')}catch(e){}
async function carica(){if(busy)return;try{const r=(await api('list','Eventi')).rows;if(busy)return;rows=r;disegna();try{localStorage.setItem('mp_eventi',JSON.stringify(rows))}catch(e){}$('#err').textContent=''}catch(e){$('#err').textContent='Errore: '+e.message}}
function disegna(){$('#evs').innerHTML=[...new Set(rows.map(r=>r.evento))].map(v=>'<option value="'+esc(v)+'">').join('');const ev=$('#evento').value.trim(),l=rows.filter(r=>r.evento===ev);const t={};l.forEach(r=>t[r.oggetto]=(t[r.oggetto]||0)+(+r.qty||0));
$('#tot').innerHTML=Object.entries(t).map(([k,v])=>'<span>'+esc(k)+': '+v+'</span>').join('')||'Nessun dato per questo evento.';
$('#lista').innerHTML=l.length?'<table><tr><th>Persona</th><th>Oggetto</th><th class="n">Qtà</th><th></th></tr>'+l.map(r=>'<tr><td><b>'+esc(r.persona)+'</b></td><td>'+esc(r.oggetto)+'</td><td class="n"><b>'+esc(r.qty)+'</b></td><td class="n"><button class="x" title="Elimina" onclick="elimina(\''+esc(r.id)+'\')">✕</button></td></tr>').join('')+'</table>':'<p>Scrivi il nome dell\'evento e registra la prima consegna.</p>'}
async function elimina(id){if(id.startsWith('tmp')||!confirm('Eliminare questa consegna?'))return;rows=rows.filter(x=>x.id!==id);disegna();busy++;try{await api('delete','Eventi',{id})}catch(e){$('#err').textContent='Errore: '+e.message}busy--;carica()}
$('#evento').oninput=()=>{const r=rows.find(x=>x.evento===$('#evento').value.trim());if(r)$('#data').value=r.data;disegna()};
$('#form').onsubmit=async e=>{e.preventDefault();const ev=$('#evento').value.trim();if(!ev){$('#err').textContent='Scrivi prima il nome dell\'evento.';return}
const row={evento:ev,data:$('#data').value,persona:$('#persona').value,oggetto:$('#oggetto').value,qty:+$('#qty').value};
rows.push({id:'tmp'+Date.now(),...row});disegna();$('#persona').value='';$('#qty').value=1;$('#persona').focus();busy++;
try{await api('add','Eventi',{row})}catch(er){$('#err').textContent='Errore: '+er.message}busy--;carica()};
if(rows.length)disegna();avvia(carica);</script></body></html>

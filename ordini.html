<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Merriweather:wght@400;700&family=Rye&display=swap" rel="stylesheet"><link rel="stylesheet" href="stile.css"><title>Manzanita Post · Ordini fattura</title><link rel="stylesheet" href="manzanita-ui.css">
</head><body>
<header><h1>Manzanita Post</h1><div id="nav"></div></header>
<main><p id="err"></p>
<form class="box" id="form"><h2>Nuovo ordine con fattura</h2><div class="f">
<label>Cliente<input id="cliente" required></label><label>Articolo<input id="articolo" required></label>
<label>Quantità<input id="qty" type="number" min="1" value="1" required></label><label>Importo $<input id="importo" type="number" step="0.01" min="0"></label>
<label>Note<input id="note"></label></div><p><button>Aggiungi ordine</button></p></form>
<div class="box"><h2>Ordini</h2><label>Mostra<select id="filtro"><option value="">Tutti</option><option>Da fare</option><option>Preparato</option><option>Consegnato</option></select></label>
<div class="tot" id="tot"></div><div id="lista"></div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script><script>
$('#nav').innerHTML=nav('o');const STATI=['Da fare','Preparato','Consegnato'];let rows=[];
let busy=0;try{rows=JSON.parse(localStorage.getItem('mp_ordini')||'[]')}catch(e){}
async function carica(){if(busy)return;try{const r=(await api('list','Ordini')).rows;if(busy)return;rows=r;disegna();try{localStorage.setItem('mp_ordini',JSON.stringify(rows))}catch(e){}$('#err').textContent=''}catch(e){$('#err').textContent='Errore: '+e.message}}
function disegna(){const f=$('#filtro').value,l=rows.filter(r=>!f||r.stato===f).reverse();
$('#tot').innerHTML='<span>'+l.length+' ordini</span><span>$'+l.reduce((s,r)=>s+(+r.importo||0),0).toFixed(2)+' da fatturare</span>';
$('#lista').innerHTML=l.map(r=>'<div class="card"><div><b>'+esc(r.articolo)+' × '+esc(r.qty)+'</b><br><small>'+esc(r.cliente)+' · '+esc(r.data)+(r.importo!==''?' · $'+esc(r.importo):'')+(r.note?'<br>'+esc(r.note):'')+'</small></div><button class="st s'+STATI.indexOf(r.stato)+'" onclick="avanza(\''+esc(r.id)+'\')">'+esc(r.stato)+'</button><button class="x" title="Elimina" onclick="elimina(\''+esc(r.id)+'\')">✕</button></div>').join('')||'<p>Nessun ordine. Aggiungine uno qui sopra.</p>'}
async function avanza(id){if(id.startsWith('tmp'))return;const r=rows.find(x=>x.id===id);r.stato=STATI[(STATI.indexOf(r.stato)+1)%3];disegna();busy++;try{await api('update','Ordini',{id,row:{stato:r.stato}})}catch(e){$('#err').textContent='Errore: '+e.message}busy--}
async function elimina(id){if(id.startsWith('tmp')||!confirm('Eliminare questo ordine?'))return;rows=rows.filter(x=>x.id!==id);disegna();busy++;try{await api('delete','Ordini',{id})}catch(e){$('#err').textContent='Errore: '+e.message}busy--;carica()}
$('#filtro').onchange=disegna;
$('#form').onsubmit=async e=>{e.preventDefault();const row={cliente:$('#cliente').value,articolo:$('#articolo').value,qty:+$('#qty').value,importo:$('#importo').value,note:$('#note').value,stato:'Da fare'};
rows.push({id:'tmp'+Date.now(),data:new Date().toISOString().slice(0,10),...row});disegna();e.target.reset();$('#qty').value=1;busy++;
try{await api('add','Ordini',{row})}catch(er){$('#err').textContent='Errore: '+er.message}busy--;carica()};
if(rows.length)disegna();avvia(carica,'Ordini');</script><script src="manzanita-ui.js"></script>
</body></html>
